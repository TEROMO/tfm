[DEFAULT]
ignoreip = 127.0.0.1/8 ::1
usedns = no
banaction = nftables-multiport
findtime = 10m
bantime = 1h
bantime.increment = true
bantime.maxtime = 1d
maxretry = 5

[sshd]
enabled = true
backend = systemd
mode = normal
port = ssh

[tfm-admin]
enabled = true
backend = auto
filter = tfm-admin
logpath = /var/log/nginx/tfm-access.log
port = http,https
bantime = 15m

[tfm-probes]
enabled = true
backend = auto
filter = tfm-probes
logpath = /var/log/nginx/tfm-access.log
port = http,https
maxretry = 3
bantime = 1h
