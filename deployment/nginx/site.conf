server {
    listen 80;
    listen [::]:80;
    server_name tyumen-factory.ru www.tyumen-factory.ru;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/tfm-acme; try_files $uri =404; }
    location / { return 301 https://tyumen-factory.ru$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.tyumen-factory.ru;
    ssl_certificate /etc/letsencrypt/live/tyumen-factory.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tyumen-factory.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/tfm-headers.conf;
    return 301 https://tyumen-factory.ru$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tyumen-factory.ru;
    ssl_certificate /etc/letsencrypt/live/tyumen-factory.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tyumen-factory.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TFMSSL:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    root /var/lib/tfm/public;
    index index.html;
    client_max_body_size 1m;
    limit_req zone=tfm_public burst=60 nodelay;
    limit_conn tfm_connections 40;
    include /etc/nginx/snippets/tfm-headers.conf;
    error_page 404 /404.html;
    error_page 429 = @tfm_rate_limited;
    access_log /var/log/nginx/tfm-access.log combined;
    error_log /var/log/nginx/tfm-error.log warn;
    location = /404.html { internal; add_header X-Robots-Tag noindex always; include /etc/nginx/snippets/tfm-headers.conf; }
    location / { try_files $uri $uri/ =404; }
    location = /blog/article/ {
        if ($arg_slug ~ "^[a-z0-9][a-z0-9-]{0,179}$") { return 301 /blog/article/$arg_slug/; }
        try_files $uri $uri/ =404;
    }
    location = /blog/admin/api/setup { return 404; }
    location = /blog/admin/api/login {
        limit_req zone=tfm_login_ip burst=4 nodelay;
        limit_req zone=tfm_login_total burst=4 nodelay;
        client_max_body_size 4k;
        include /etc/nginx/snippets/tfm-proxy.conf;
    }
    location ^~ /blog/admin/api/ {
        limit_req zone=tfm_api burst=20 nodelay;
        client_max_body_size 5m;
        include /etc/nginx/snippets/tfm-proxy.conf;
    }
    location ^~ /blog/admin/ {
        try_files $uri $uri/ =404;
        include /etc/nginx/snippets/tfm-headers.conf;
        add_header Cache-Control no-store always;
        add_header X-Robots-Tag noindex always;
    }
    location ^~ /blog/posts/ {
        try_files $uri =404;
        include /etc/nginx/snippets/tfm-headers.conf;
        add_header Cache-Control no-cache always;
    }
    location ^~ /blog/uploads/ {
        if ($uri !~ "^/blog/uploads/[a-zA-Z0-9_-]+\.(png|jpe?g|webp)$") { return 404; }
        try_files $uri =404;
        include /etc/nginx/snippets/tfm-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/tfm-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ~ /\. { return 404; }
    location ~* ^/(?:data|server|src|node_modules|work|\.git)(?:/|$) { return 404; }
    location ~* \.(?:php|mjs|env|sql|sqlite|db|bak|sh|toml|ini|log|map)$ { return 404; }
    location @tfm_rate_limited {
        default_type application/json;
        include /etc/nginx/snippets/tfm-headers.conf;
        add_header Cache-Control no-store always;
        add_header Retry-After 60 always;
        return 429 '{"error":"Слишком много запросов. Подождите минуту и попробуйте снова."}';
    }
}
