server_tokens off;
client_header_timeout 15s;
client_body_timeout 15s;
send_timeout 30s;
keepalive_timeout 30s;
limit_req_zone $binary_remote_addr zone=tfm_login_ip:1m rate=6r/m;
limit_req_zone $server_name zone=tfm_login_total:1m rate=2r/s;
limit_req_zone $binary_remote_addr zone=tfm_api:2m rate=5r/s;
limit_req_zone $binary_remote_addr zone=tfm_public:2m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=tfm_connections:2m;
limit_req_status 429;
limit_conn_status 429;
